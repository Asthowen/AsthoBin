[package]
name = "asthobin"
version = "0.2.1"
authors = ["Asthowen<contact@asthowen.fr>"]
edition = "2024"
description = "AsthoBin is a simple website to share pieces of code with a URL, written in Rust."
repository = "https://github.com/Asthowen/AsthoBin"
readme = "README.md"
license = "GPL-3.0"
keywords = ["asthobin", "paste", "rust"]
publish = false

[profile.release]
codegen-units = 1
strip = true
lto = true

[lints.cargo]
unused_dependencies = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[build-dependencies]
dotenvy = "0.15.7"
static-files = "0.3.1"

[dependencies]
actix-cors = "0.7.2"
actix-files = "0.7.4"
actix-governor = "0.10.0"
actix-web = "4.19.0"
actix-web-static-files = { version = "4.1.1", default-features = false, features = [
    "static-files-03",
] }
askama = "0.16.1"
chrono = "0.4.45"
confik = { version = "0.15.13", default-features = false, features = ["env"] }
dashmap = "6.1.0"
diesel = "2.4.0"
diesel-async = { version = "0.10.0", features = [
    "async-connection-wrapper",
    "bb8",
    "migrations",
    "postgres",
] }
diesel_migrations = "2.4.0"
dotenvy = "0.15.7"
env_logger = "0.11.11"
log = "0.4.35"
rand = "0.10.3"
serde = "1.0.229"
serde_json = "1.0.154"
static-files = "0.3.1"
syntect = "5.3.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = [
    "fs",
    "macros",
    "rt",
] }
